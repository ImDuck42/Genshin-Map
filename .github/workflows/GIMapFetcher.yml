name: Fetch and Export Map Tiles

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

jobs:
  export-tiles:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r assets/requirements.txt

      - name: Run Map Exporter
        working-directory: assets
        run: |
          python getGIMaps.py

      - name: Commit and Push Tiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git config http.postBuffer 1048576000
          git config http.lowSpeedLimit 0
          git config http.lowSpeedTime 999999

          if [ -f assets/genshin_maps/index.json ]; then
            git add assets/genshin_maps/index.json
            if ! git diff --staged --quiet; then
              git commit -m "Update map index [skip ci]"
              git push origin HEAD
            fi
          fi

          for folder in assets/genshin_maps/*/; do
            if [ -d "$folder" ]; then
              map_name=$(basename "$folder")
              echo "Processing $map_name..."

              git add "$folder"

              if ! git diff --staged --quiet; then
                git commit -m "Update tiles for $map_name [skip ci]"
                
                for i in {1..3}; do
                  git push origin HEAD && break || (echo "Push failed, retrying in 10s..." && sleep 10)
                done
              else
                echo "No changes for $map_name."
              fi
            fi
          done